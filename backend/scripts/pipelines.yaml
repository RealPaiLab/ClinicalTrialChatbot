ctc:
  source:
    kind: api
    base_url: ${CTC_API_BASE_URL}
    search_scope: CA
    page_size: 100
    concurrency: 5

  diff:
    strategy: timestamp
    # true rebuilds and re-embeds everything.
    full_refresh: false

  build:
    batch_size: 500

  geocode:
    concurrency: 20
    limit: null

  embed:
    provider: null      # null uses EMBEDDING_PROVIDER
    batch_size: null    # null uses EMBEDDING_BATCH_SIZE
    limit: null
    batch_id: null      # resume an OpenAI batch that was already submitted
    force: false

  validate:
    max_trial_drop_pct: 5
    max_location_drop_pct: 5
    max_site_drop_pct: 5
    min_geocode_coverage: 0.95
    min_embedding_coverage: 0.99
    coverage_must_not_regress: true

  publish:
    keep_generations: 3
    lock_timeout: 5s

  stages: [ingest, diff, build, geocode, embed, validate, publish]

# The C17 pediatric registry. Server-rendered pages, so the source is a scraper.
# The pages carry site coordinates but no address, so the geocode stage runs in
# reverse here: city and province from lat/lon.
ulc:
  source:
    kind: scrape
    base_url: ${ULINK_BASE_URL:-https://u-link.care}
    concurrency: 4
    # The capture keeps every status; only these are published. Open maps to
    # the `recruiting` state the app already knows.
    statuses: [Open]

  diff:
    strategy: timestamp
    full_refresh: false

  build:
    batch_size: 500

  geocode:
    concurrency: 20
    limit: null

  embed:
    provider: null
    batch_size: null
    limit: null
    batch_id: null
    force: false

  # A corpus of ~50 published trials: one trial is 2%, so the drop thresholds
  # are wider than CTC's.
  validate:
    max_trial_drop_pct: 10
    max_location_drop_pct: 10
    max_site_drop_pct: 10
    min_geocode_coverage: 0.95
    min_embedding_coverage: 0.99
    coverage_must_not_regress: true

  publish:
    keep_generations: 3
    lock_timeout: 5s

  stages: [ingest, diff, build, geocode, embed, validate, publish]
