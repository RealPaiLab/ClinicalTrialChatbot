name: Build

# On a release tag from release-please, build + scan + PUSH the image
on:
  push:
    tags:
      - "backend-v*"
      - "frontend-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.t.outputs.package }}
      version: ${{ steps.t.outputs.version }}
    steps:
      - name: Parse package and version from tag
        id: t
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            backend-v*)  pkg="backend";  ver="${REF_NAME#backend-v}"  ;;
            frontend-v*) pkg="frontend"; ver="${REF_NAME#frontend-v}" ;;
            *) echo "Unexpected tag: $REF_NAME"; exit 1 ;;
          esac
          {
            echo "package=$pkg"
            echo "version=$ver"
          } >> "$GITHUB_OUTPUT"

  image:
    needs: resolve
    uses: ./.github/workflows/image.yml
    with:
      package: ${{ needs.resolve.outputs.package }}
      channel: release
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  # Deploy is disabled: no self-hosted runner can reach now
