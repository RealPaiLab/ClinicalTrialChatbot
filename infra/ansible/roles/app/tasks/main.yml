---
- name: Create the app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: Render the prod app compose file
  ansible.builtin.template:
    src: docker-compose.app.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    mode: "0644"

- name: Render the backend .env (envfile backend)
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    mode: "0600"
  when: secret_backend == 'envfile'

- name: Push app secrets to the cloud secret manager (cloud backend)
  ansible.builtin.debug:
    msg: >-
      TODO (secret_backend=cloud): push the secret inventory to the cloud secret
      manager and rely on the VM instance role + app startup fetch. No .env is written.
  when: secret_backend == 'cloud'

- name: Look up the deploy user uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ deploy_user }}"

- name: Set the rootless Docker connection env
  ansible.builtin.set_fact:
    app_docker_env:
      DOCKER_HOST: "unix:///run/user/{{ getent_passwd[deploy_user][1] }}/docker.sock"
      XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[deploy_user][1] }}"

- name: Log in to GHCR (persists in the deploy user's docker config)
  community.docker.docker_login:
    registry: "{{ registry }}"
    username: "{{ ghcr_pull_username }}"
    password: "{{ ghcr_pull_token }}"
  become: true
  become_user: "{{ deploy_user }}"
  environment: "{{ app_docker_env }}"
  when: ghcr_pull_token | default('') | length > 0

- name: Bring up the app stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: always
    state: present
  become: true
  become_user: "{{ deploy_user }}"
  environment: "{{ app_docker_env | combine({'BACKEND_VERSION': backend_version, 'FRONTEND_VERSION': frontend_version}) }}"
