---
- name: Fail if no dump path was given
  ansible.builtin.assert:
    that: db_restore_dump_src | length > 0
    fail_msg: "Pass the dump path: -e db_restore_dump_src=/path/to/ctc_seed.dump"

- name: Check the restore marker
  ansible.builtin.stat:
    path: "{{ app_dir }}/.seed_applied"
  register: db_restore_seed_marker

- name: Restore the embeddings dump (first time only)
  when: not db_restore_seed_marker.stat.exists
  block:
    - name: Copy the dump to the App VM
      ansible.builtin.copy:
        src: "{{ db_restore_dump_src }}"
        dest: "{{ app_dir }}/ctc_seed.dump"
        owner: "{{ deploy_user }}"
        mode: "0600"

    - name: Restore the dump into the app database
      ansible.builtin.shell:
        cmd: >-
          docker compose exec -T postgres
          pg_restore --no-owner --no-privileges --clean --if-exists
          -U {{ postgres_user }} -d {{ postgres_db }} < {{ app_dir }}/ctc_seed.dump
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true

    - name: Stamp alembic at head (the dump is authoritative)
      ansible.builtin.command:
        cmd: docker compose run --rm backend alembic stamp head
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ deploy_user }}"
      changed_when: true

    - name: Write the restore marker
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.seed_applied"
        content: "{{ db_restore_dump_sha256 }}\n"
        owner: "{{ deploy_user }}"
        mode: "0644"

    - name: Remove the dump from the VM
      ansible.builtin.file:
        path: "{{ app_dir }}/ctc_seed.dump"
        state: absent
