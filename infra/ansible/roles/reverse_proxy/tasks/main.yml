---
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    update_cache: true

- name: Create the ACME webroot
  ansible.builtin.file:
    path: "{{ reverse_proxy_certbot_webroot }}"
    state: directory
    mode: "0755"

- name: Check whether the TLS certificate already exists
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ public_domain }}/fullchain.pem
  register: reverse_proxy_tls_cert

- name: Render the site config (HTTP bootstrap)
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ project_name }}.conf
    mode: "0644"
  vars:
    tls_enabled: "{{ reverse_proxy_tls_cert.stat.exists | bool }}"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ project_name }}.conf
    dest: /etc/nginx/sites-enabled/{{ project_name }}.conf
    state: link
  notify: Reload nginx

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Apply the HTTP config so the ACME challenge is reachable
  ansible.builtin.meta: flush_handlers

- name: Obtain the certificate (webroot)
  ansible.builtin.command:
    cmd: >-
      certbot certonly --webroot -w {{ reverse_proxy_certbot_webroot }}
      -d {{ public_domain }} --non-interactive --agree-tos -m {{ certbot_email }}
    creates: /etc/letsencrypt/live/{{ public_domain }}/fullchain.pem
  when: certbot_enabled | bool

- name: Install the nginx reload hook for cert renewals
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    content: |
      #!/bin/sh
      systemctl reload nginx
    mode: "0755"
  when: certbot_enabled | bool

- name: Re-check the certificate after issuance
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ public_domain }}/fullchain.pem
  register: reverse_proxy_tls_cert_final

- name: Render the site config (final, TLS when the cert is present)
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ project_name }}.conf
    mode: "0644"
  vars:
    tls_enabled: "{{ reverse_proxy_tls_cert_final.stat.exists | bool }}"
  notify: Reload nginx
