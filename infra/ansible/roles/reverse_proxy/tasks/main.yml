---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Render the site config
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ project_name }}.conf
    mode: "0644"
  notify: Reload nginx

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ project_name }}.conf
    dest: /etc/nginx/sites-enabled/{{ project_name }}.conf
    state: link
  notify: Reload nginx

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Reload nginx daily so renewed dehydrated certs are picked up
  ansible.builtin.copy:
    dest: /etc/cron.d/nginx-reload
    content: |
      # Managed by Ansible (reverse_proxy). Reload nginx so renewed certs load.
      15 3 * * * root /usr/sbin/nginx -t >/dev/null 2>&1 && /bin/systemctl reload nginx
    mode: "0644"
