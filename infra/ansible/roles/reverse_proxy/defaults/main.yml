---
reverse_proxy_site_name: "{{ project_name }}"

reverse_proxy_cert_fullchain: "/var/lib/dehydrated/certs/{{ public_domain }}/fullchain.pem"
reverse_proxy_cert_privkey: "/var/lib/dehydrated/certs/{{ public_domain }}/privkey.pem"
reverse_proxy_acme_webroot: /var/lib/dehydrated/acme-challenges

reverse_proxy_backend_port: "{{ backend_host_port | default(8000) }}"
reverse_proxy_frontend_port: "{{ frontend_host_port | default(8080) }}"

reverse_proxy_rate_limit_enabled: true

reverse_proxy_chat_rate: 10r/m
reverse_proxy_chat_burst: 10

reverse_proxy_api_rate: 10r/s
reverse_proxy_api_burst: 20
