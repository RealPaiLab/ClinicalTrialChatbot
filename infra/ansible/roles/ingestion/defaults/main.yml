---
# deploy_slot keeps a co-hosted second environment from colliding.
ingestion_unit_prefix: "{{ project_name }}-{{ deploy_slot }}-ingestion"

# timeout for a run to complete, in seconds. 6 hours by default.
ingestion_timeout_sec: 21600

# One timer per pipeline in `backend/scripts/pipelines.yaml`, keyed by its name.
# Opt in per environment. Both share one Postgres and each publish takes a
# schema lock, so keep their calendars hours apart: a run that overlaps another
# would race on `DROP SCHEMA <pipeline>_build`.
ingestion_pipelines:
  ctc:
    enabled: false
    on_calendar: "Sat *-*-* 13:00:00 UTC"
  ulc:
    enabled: false
    on_calendar: "Sat *-*-* 17:00:00 UTC"
