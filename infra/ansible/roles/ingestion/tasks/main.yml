---
- name: Install the ingestion units
  ansible.builtin.template:
    src: "ingestion.{{ item.1 }}.j2"
    dest: "/etc/systemd/system/{{ ingestion_unit_prefix }}-{{ item.0.key }}.{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    pipeline: "{{ item.0.key }}"
    schedule: "{{ item.0.value }}"
  loop: "{{ ingestion_pipelines | dict2items | selectattr('value.enabled') | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0.key }}.{{ item.1 }}"
  become: true
  notify: Reload systemd

- name: Enable the ingestion timers
  ansible.builtin.systemd_service:
    name: "{{ ingestion_unit_prefix }}-{{ item.key }}.timer"
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ ingestion_pipelines | dict2items | selectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ item.key }}"
  become: true

# Without this, disabling a pipeline leaves a live timer behind.
- name: Stop the ingestion timers where scheduling is off
  ansible.builtin.systemd_service:
    name: "{{ ingestion_unit_prefix }}-{{ item.key }}.timer"
    state: stopped
    enabled: false
  loop: "{{ ingestion_pipelines | dict2items | rejectattr('value.enabled') | list }}"
  loop_control:
    label: "{{ item.key }}"
  become: true
  failed_when: false

- name: Remove the ingestion units where scheduling is off
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ ingestion_unit_prefix }}-{{ item.0.key }}.{{ item.1 }}"
    state: absent
  loop: "{{ ingestion_pipelines | dict2items | rejectattr('value.enabled') | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0.key }}.{{ item.1 }}"
  become: true
  notify: Reload systemd

# The single-pipeline units this role installed before it was keyed by pipeline.
- name: Stop the legacy single-pipeline timer
  ansible.builtin.systemd_service:
    name: "{{ ingestion_unit_prefix }}.timer"
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove the legacy single-pipeline units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ ingestion_unit_prefix }}.{{ item }}"
    state: absent
  loop:
    - service
    - timer
  become: true
  notify: Reload systemd
