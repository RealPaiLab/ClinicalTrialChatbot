# One-time base setup + hardening. Run locally by the operator.
---
- name: Base setup (every VM)
  hosts: common:langfuse
  vars_files:
    - "{{ playbook_dir }}/../secrets.yml"
  roles:
    - common
    # - hardening  # PoC: deferred until post-PoC security review
    - docker

# One nginx site per deployed environment, each with its own dehydrated cert.
- name: Reverse proxy (every app environment)
  hosts: common
  vars_files:
    - "{{ playbook_dir }}/../secrets.yml"
  roles:
    - reverse_proxy
