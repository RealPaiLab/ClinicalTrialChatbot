# Repetitive. Run by CI on a release tag. App VM only
---
- name: Deploy app
  hosts: app
  remote_user: "{{ deploy_user }}"
  become: false
  vars:
    version_var: "{{ 'BACKEND_VERSION' if deploy_package == 'backend' else 'FRONTEND_VERSION' }}"
  tasks:
    - name: Validate inputs
      ansible.builtin.assert:
        that:
          - deploy_package | default('') in ['backend', 'frontend']
          - image_tag | default('') | length > 0
        fail_msg: "Pass -e deploy_package=backend|frontend and -e image_tag=X.Y.Z"

    - name: Look up the deploy user uid
      ansible.builtin.getent:
        database: passwd
        key: "{{ deploy_user }}"

    - name: Set the rootless Docker connection env
      ansible.builtin.set_fact:
        deploy_docker_env:
          DOCKER_HOST: "unix:///run/user/{{ getent_passwd[deploy_user][1] }}/docker.sock"
          XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[deploy_user][1] }}"

    - name: Pin the released version for compose interpolation
      ansible.builtin.lineinfile:
        path: "{{ app_dir }}/.env"
        regexp: "^{{ version_var }}="
        line: "{{ version_var }}={{ image_tag }}"
        create: true
        mode: "0600"

    - name: Pull the released image and recreate changed containers
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        pull: missing
        state: present
      environment: "{{ deploy_docker_env }}"

    - name: Apply database migrations (backend releases only)
      ansible.builtin.command:
        cmd: docker compose run --rm backend alembic upgrade head
        chdir: "{{ app_dir }}"
      environment: "{{ deploy_docker_env }}"
      register: migrate
      changed_when: "'Running upgrade' in migrate.stdout"
      when:
        - deploy_package == 'backend'
        - run_migrations | default(true) | bool
