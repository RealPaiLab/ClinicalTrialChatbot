all:
  vars:
    ansible_user: REPLACE_WITH_SSH_USER
    ansible_ssh_private_key_file: ~/.ssh/REPLACE_WITH_KEY
  children:
    # Both deployed environments. Shared vars live in group_vars/common.yml;
    # per-environment overrides in group_vars/production.yml and group_vars/staging.yml.
    common:
      children:
        production:
          hosts:
            production-vm:
              ansible_host: REPLACE_WITH_APP_VM_IP
              private_ip: REPLACE_WITH_APP_VM_PRIVATE_IP
              public_domain: chatbot.example.org      # internal name, has the dehydrated cert; canonical origin
              external_domain: chat.example.org       # edge-terminated name; added to server_name + CORS
        staging:
          hosts:
            staging-vm:
              ansible_host: REPLACE_WITH_LANGFUSE_VM_IP
              private_ip: REPLACE_WITH_LANGFUSE_VM_PRIVATE_IP
              public_domain: langfuse.example.org
    langfuse:
      hosts:
        langfuse-vm:
          ansible_host: REPLACE_WITH_LANGFUSE_VM_IP
          private_ip: REPLACE_WITH_LANGFUSE_VM_PRIVATE_IP
          public_domain: langfuse.example.org
