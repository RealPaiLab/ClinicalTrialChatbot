# Production overrides. Everything else comes from group_vars/common.yml

cors_allow_origins:
  - "https://{{ public_domain }}"
  - "https://{{ external_domain }}"

# Ingestion pipelines, one timer each. Hours apart: they share the database.
ingestion_pipelines:
  ctc:
    enabled: false
    on_calendar: "Sat *-*-* 13:00:00 UTC"
  ulc:
    enabled: false
    on_calendar: "Sat *-*-* 17:00:00 UTC"
