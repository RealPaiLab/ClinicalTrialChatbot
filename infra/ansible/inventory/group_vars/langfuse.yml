langfuse_dir: /opt/{{ project_name }}/langfuse

langfuse_web_image: langfuse/langfuse:3
langfuse_worker_image: langfuse/langfuse-worker:3

postgres_user: ctc
postgres_db: langfuse

langfuse_init_org_name: "Open Genome Informatics"
langfuse_init_project_name: "Clinical Trial Chatbot"

# The staging stack is co-hosted on this VM and ingests traces from a container.
langfuse_allow_docker_bridge: true
langfuse_docker_bridge_cidr: "172.16.0.0/12"
