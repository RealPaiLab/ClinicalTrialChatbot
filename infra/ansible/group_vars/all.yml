# Non-secret defaults

project_name: ctc
deploy_user: deploy
deploy_home: "/home/{{ deploy_user }}"
timezone: UTC

# SSH (port 22) allow-list. Will finalize once IT confirms the platform:
#   cloud   -> VPN range, or use SSM/IAP and close 22 entirely
#   on-prem -> IT's internal/VPN ranges (their network firewall is the main boundary)
admin_cidrs:
  - "0.0.0.0/0"

# Container registry (GHCR)
registry: ghcr.io
registry_owner: REPLACE_WITH_OWNER

# TLS / certbot
certbot_enabled: true
certbot_email: REPLACE_WITH_EMAIL

# Secret gate
secret_backend: envfile
